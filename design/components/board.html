<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: 'system-fallback'; src: local('Helvetica Neue'), local('Arial'); }
  </style>
</helmet>
<div style="--frame:#5C3A21;--point-a:#E9D8B4;--point-b:#8B3A2A;--bar:#2A1810;--tray-bg:#452B18;--frame-edge:#3E2716;--number-light:#E9D8B4;--number-dark:#2A1810; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#1c1310; font-family:'Helvetica Neue', Arial, sans-serif;">
  <svg viewBox="0 0 1100 700" width="100%" height="100%" style="max-width:1100px; max-height:700px; display:block;">
    <rect x="0" y="0" width="1100" height="700" rx="10" fill="var(--frame)" stroke="var(--frame-edge)" stroke-width="4"></rect>

    <rect x="24" y="24" width="918" height="652" fill="var(--frame)"></rect>

    <rect x="453" y="24" width="60" height="652" fill="var(--bar)"></rect>

    <sc-if value="{{ showBearOffTray }}" hint-placeholder-val="{{ true }}">
      <rect x="942" y="24" width="24" height="652" fill="var(--frame-edge)"></rect>
      <rect x="966" y="24" width="110" height="652" fill="var(--tray-bg)"></rect>
      <rect x="966" y="346" width="110" height="8" fill="var(--frame-edge)"></rect>
    </sc-if>

    <sc-for list="{{ points }}" as="pt" hint-placeholder-count="24">
      <polygon points="{{ pt.polygon }}" fill="{{ pt.fill }}" stroke="var(--frame-edge)" stroke-width="1"></polygon>
      <sc-if value="{{ showPointNumbers }}" hint-placeholder-val="{{ false }}">
        <text x="{{ pt.numX }}" y="{{ pt.numY }}" fill="{{ pt.numColor }}" font-size="18" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">{{ pt.number }}</text>
      </sc-if>
    </sc-for>
  </svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1100, &quot;height&quot;: 700},
  &quot;showPointNumbers&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;},
  &quot;showBearOffTray&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;},
  &quot;perspective&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;standard&quot;, &quot;options&quot;: [&quot;standard&quot;, &quot;flipped&quot;], &quot;tsType&quot;: &quot;'standard' | 'flipped'&quot;}
}">
class Component extends DCLogic {
  buildPoints(flipped) {
    const A = 'var(--point-a)';
    const B = 'var(--point-b)';
    const halfW = 429, pointW = halfW / 6;
    const leftX = 24, rightX = 513;
    const topBaseY = 24, topTipY = 330;
    const botBaseY = 676, botTipY = 370;

    // slot index 0..5 left-to-right within a half
    const slotX = (startX, i) => startX + i * pointW;

    const quadrants = [
      // {row:'bottom'|'top', half:'left'|'right', baseNumbers: number for slot index 0..5}
      { row: 'bottom', startX: rightX, numbers: [6, 5, 4, 3, 2, 1] },   // bottom-right: slot0..5 -> nums 6..1 (1 at rightmost slot5)
      { row: 'bottom', startX: leftX, numbers: [12, 11, 10, 9, 8, 7] }, // bottom-left: slot5 adjacent to bar =7
      { row: 'top', startX: leftX, numbers: [13, 14, 15, 16, 17, 18] },
      { row: 'top', startX: rightX, numbers: [19, 20, 21, 22, 23, 24] },
    ];

    const points = [];
    quadrants.forEach(q => {
      for (let i = 0; i < 6; i++) {
        const x0 = slotX(q.startX, i);
        const cx = x0 + pointW / 2;
        const colorIsA = (i % 2 === 0);
        const fill = colorIsA ? A : B;
        let polygon, numY;
        if (q.row === 'bottom') {
          polygon = `${x0},${botBaseY} ${x0 + pointW},${botBaseY} ${cx},${botTipY}`;
          numY = botBaseY - 16;
        } else {
          polygon = `${x0},${topBaseY} ${x0 + pointW},${topBaseY} ${cx},${topTipY}`;
          numY = topBaseY + 24;
        }
        const baseNumber = q.numbers[i];
        const number = flipped ? (25 - baseNumber) : baseNumber;
        const numColor = colorIsA ? 'var(--number-dark)' : 'var(--number-light)';
        points.push({ polygon, fill, numX: cx, numY, number, numColor });
      }
    });
    return points;
  }

  renderVals() {
    const flipped = (this.props.perspective ?? 'standard') === 'flipped';
    return {
      points: this.buildPoints(flipped),
      showPointNumbers: this.props.showPointNumbers ?? false,
      showBearOffTray: this.props.showBearOffTray ?? true,
    };
  }
}

</script>
</body>
</html>
